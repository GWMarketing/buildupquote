services:
  web:
    build: .
    container_name: buildupquote_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/buildupquote_db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    container_name: buildupquote_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: buildupquote_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d buildupquote_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

