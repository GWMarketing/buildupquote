services:
  web:
    build: .
    container_name: buildupquote_app
    restart: always
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/buildupquote_db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    container_name: buildupquote_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: buildupquote_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

