services:
  web:
    build: .
    container_name: buildupquote_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/buildupquote_db
      # Google Sign-In: create a "Web application" OAuth client in Google
      # Cloud Console, add https://<your-domain> as an Authorized JavaScript
      # origin, and paste its client ID below (ends with
      # .apps.googleusercontent.com). Leave empty/unset to hide the button.
      GOOGLE_CLIENT_ID: "774097660308-37rbr63bv9ec5bu9ma0bfa88220b1nt0.apps.googleusercontent.com"
      # Google Contacts sync (People API) -- unlike Sign-In this needs the OAuth
      # client secret. Set GOOGLE_CLIENT_SECRET in a .env file next to this
      # compose file (docker compose reads it automatically for interpolation;
      # .env is gitignored so deploys never clobber it). Leave unset to hide
      # the Sync Google Contacts button.
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # Google Contacts OAuth redirect URI -- must EXACTLY match an entry in the
      # OAuth client's "Authorized redirect URIs" (https, no trailing slash).
      # Public value (it appears in the consent URL), safe to commit.
      GOOGLE_REDIRECT_URI: "https://glennwestman.com/api/auth/google/contacts/callback"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    container_name: buildupquote_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: buildupquote_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d buildupquote_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

