# BuildUpQuote -- nginx reverse proxy.
#
# Copy to /etc/nginx/sites-available/buildupquote, symlink into
# sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
# For TLS: sudo apt install -y certbot python3-certbot-nginx
#          sudo certbot --nginx -d yourdomain.com
server {
    listen 80;
    server_name yourdomain.com;

    # Carrier PDFs can be large -- nginx's default limit (1MB) would
    # reject them. This matches the app's 300MB upload cap.
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
