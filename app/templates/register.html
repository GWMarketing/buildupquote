{% extends "base.html" %}
{% block content %}
<div class="flex min-h-[70vh] items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">BUILDUPQUOTE</h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Set up your contractor workspace</p>
    </div>
    <div class="bq-card p-6">
      <div id="error" class="mb-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></div>
      <form id="registerForm" class="space-y-3">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Full name</label>
          <input id="full_name" type="text" required class="bq-input">
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <input id="email" type="email" required class="bq-input">
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
          <input id="password" type="password" required minlength="8" class="bq-input">
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Company / business name</label>
          <input id="organization_name" type="text" required class="bq-input" placeholder="e.g. Glenn's Roofing & Co">
        </div>
        <button type="submit" class="w-full rounded-lg bg-slate-900 py-2 text-sm font-medium text-white hover:bg-slate-700 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200">
          Create account
        </button>
      </form>
      <p class="mt-4 text-center text-sm text-slate-500 dark:text-slate-400">
        Already registered? <a href="/login" class="font-medium text-blue-600 hover:underline dark:text-blue-400">Sign in</a>
      </p>
    </div>
  </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  err.classList.add('hidden');
  const payload = {
    full_name: document.getElementById('full_name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    organization_name: document.getElementById('organization_name').value.trim(),
  };
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error((typeof data.detail === 'string' ? data.detail : 'Registration failed') || 'Registration failed');
    // The register endpoint issues a JWT directly, so we can land on the
    // dashboard without a second login round-trip.
    BQ.setToken(data.access_token);
    location.href = '/dashboard';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
  }
});
</script>
{% endblock %}
