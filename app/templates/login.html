{% extends "base.html" %}
{% block content %}
<div class="flex min-h-[70vh] items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">BUILDUPQUOTE</h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Sign in to your contractor workspace</p>
    </div>
    <div class="bq-card p-6">
      <div id="error" class="mb-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></div>
      <form id="loginForm" class="space-y-3">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <input id="email" type="email" required class="bq-input">
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
          <input id="password" type="password" required class="bq-input">
        </div>
        <button type="submit" class="w-full rounded-lg bg-slate-900 py-2 text-sm font-medium text-white hover:bg-slate-700 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200">
          Sign in
        </button>
      </form>
      <p class="mt-4 text-center text-sm text-slate-500 dark:text-slate-400">
        New here? <a href="/register" class="font-medium text-blue-600 hover:underline dark:text-blue-400">Create an account</a>
      </p>
    </div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  err.classList.add('hidden');
  const body = new URLSearchParams({
    username: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  });
  try {
    const res = await fetch('/api/auth/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Sign in failed');
    BQ.setToken(data.access_token);
    location.href = '/dashboard';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
  }
});
</script>
{% endblock %}
