<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — BuildUpQuote</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">BUILDUPQUOTE</h1>
      <p class="mt-1 text-sm text-slate-500">Sign in to your contractor workspace</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <div id="error" class="mb-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"></div>
      <form id="loginForm" class="space-y-3">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
          <input id="email" type="email" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
          <input id="password" type="password" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-slate-900 py-2 text-sm font-medium text-white hover:bg-slate-700">
          Sign in
        </button>
      </form>
      <p class="mt-4 text-center text-xs text-slate-400">
        No account? Use <code class="rounded bg-slate-100 px-1">/api/auth/register</code> to create one.
      </p>
    </div>
  </div>
<script src="/static/js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  err.classList.add('hidden');
  const body = new URLSearchParams({
    username: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  });
  try {
    const res = await fetch('/api/auth/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Sign in failed');
    BQ.setToken(data.access_token);
    location.href = '/dashboard';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
  }
});
</script>
</body>
</html>
