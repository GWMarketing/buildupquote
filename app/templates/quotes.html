{% extends "base.html" %}
{% block content %}
<div x-data="quotesPage()" x-init="init()" class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold text-slate-900">Quotes</h1>
    <button class="bq-btn" @click="createQuote()">＋ Create Quote</button>
  </div>

  <div class="bq-card overflow-x-auto">
    <table class="w-full grid-table">
      <thead>
        <tr>
          <th>Quote</th><th>Client</th><th>Site</th><th>Status</th><th class="text-right">Total</th><th>Created</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="q in quotes" :key="q.id">
          <tr class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700" @click="location.href='/quotes/' + q.id">
            <td class="text-sm font-medium text-slate-900" x-text="q.title"></td>
            <td class="text-sm text-slate-600" x-text="q.client_name || '—'"></td>
            <td class="text-sm text-slate-600" x-text="q.site_address || '—'"></td>
            <td><span class="badge" :class="BQ.statusClass(q.status)" x-text="q.status.charAt(0).toUpperCase() + q.status.slice(1)"></span></td>
            <td class="text-right text-sm font-semibold text-slate-900" x-text="BQ.money(q.total)"></td>
            <td class="text-sm text-slate-500" x-text="new Date(q.created_at).toLocaleDateString()"></td>
          </tr>
        </template>
      </tbody>
    </table>
    <p class="p-5 text-sm text-slate-500" x-show="!loading && quotes.length === 0" x-cloak>No quotes yet.</p>
  </div>
</div>

<script>
function quotesPage() {
  return {
    quotes: [], loading: true,
    async init() {
      try { this.quotes = await BQ.api('/api/quotes'); } catch (e) { console.error(e); }
      this.loading = false;
    },
    async createQuote() {
      const q = await BQ.api('/api/quotes', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'Untitled quote' }),
      });
      location.href = '/quotes/' + q.id;
    },
  };
}
</script>
{% endblock %}
