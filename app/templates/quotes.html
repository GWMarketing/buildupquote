{% extends "base.html" %}
{% block content %}
<div x-data="quotesPage()" x-init="init()" class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold text-slate-900 dark:text-white">Quotes</h1>
    <button class="bq-btn" @click="createQuote()">＋ Create Quote</button>
  </div>

  <div class="bq-card overflow-x-auto">
    <table class="w-full grid-table">
      <thead>
        <tr>
          <th>Quote</th><th>Client</th><th>Site</th><th>Status</th><th class="text-right">Total</th><th>Created</th><th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="q in quotes" :key="q.id">
          <tr class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700" @click="location.href='/quotes/' + q.id">
            <td class="text-sm font-medium text-slate-900 dark:text-slate-100" x-text="q.title"></td>
            <td class="text-sm text-slate-600 dark:text-slate-300" x-text="q.client_name || '—'"></td>
            <td class="text-sm text-slate-600 dark:text-slate-300" x-text="q.site_address || '—'"></td>
            <td><span class="badge" :class="BQ.statusClass(q.status)" x-text="q.status.charAt(0).toUpperCase() + q.status.slice(1)"></span></td>
            <td class="text-right text-sm font-semibold text-slate-900 dark:text-slate-100" x-text="BQ.money(q.total)"></td>
            <td class="text-sm text-slate-500" x-text="new Date(q.created_at).toLocaleDateString()"></td>
            <td class="text-right">
              <button class="px-2 py-1 text-slate-400 hover:text-red-600" title="Delete quote"
                      @click.stop="confirmDelete(q)">🗑</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
    <p class="p-5 text-sm text-slate-500" x-show="!loading && quotes.length === 0" x-cloak>No quotes yet.</p>
  </div>

  <!-- Delete confirmation modal -->
  <div x-show="target" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"
       @keydown.escape.window="target = null">
    <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-xl">
      <h2 class="text-base font-semibold text-slate-900">Delete quote?</h2>
      <p class="mt-2 text-sm text-slate-500">
        Are you sure you want to delete this quote (<span class="font-medium text-slate-700" x-text="target && target.title"></span>)?
        This action cannot be undone.
      </p>
      <div class="mt-5 flex justify-end gap-2">
        <button class="bq-btn-secondary" @click="target = null">Cancel</button>
        <button class="rounded-lg bg-red-600 px-3 py-2 text-sm font-medium text-white hover:bg-red-700"
                :disabled="deleting" @click="doDelete()" x-text="deleting ? 'Deleting…' : 'Delete'"></button>
      </div>
    </div>
  </div>
</div>

<script>
function quotesPage() {
  return {
    quotes: [], loading: true, target: null, deleting: false,
    async init() {
      try { this.quotes = await BQ.api('/api/quotes'); } catch (e) { console.error(e); }
      this.loading = false;
    },
    async createQuote() {
      const q = await BQ.api('/api/quotes', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: 'Untitled quote' }),
      });
      location.href = '/quotes/' + q.id;
    },
    confirmDelete(q) { this.target = q; },
    async doDelete() {
      if (!this.target) return;
      this.deleting = true;
      try {
        await BQ.api('/api/quotes/' + this.target.id, { method: 'DELETE' });
        this.quotes = this.quotes.filter(q => q.id !== this.target.id);
        this.target = null;
      } catch (e) { alert('Delete failed: ' + e.message); }
      this.deleting = false;
    },
  };
}
</script>
{% endblock %}
