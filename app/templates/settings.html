{% extends "base.html" %}
{% block content %}
<div x-data="settingsPage()" x-init="init()" class="max-w-2xl space-y-5">
  <h1 class="text-xl font-bold text-slate-900">Settings</h1>

  <div class="bq-card p-6">
    <h2 class="mb-4 text-sm font-semibold text-slate-900">Company profile</h2>
    <div class="grid gap-4 sm:grid-cols-2">
      <div class="sm:col-span-2"><label class="mb-1 block text-xs font-medium text-slate-500">Business name</label>
        <input class="bq-input" x-model="profile.name"></div>
      <div class="sm:col-span-2"><label class="mb-1 block text-xs font-medium text-slate-500">Address</label>
        <input class="bq-input" x-model="profile.address"></div>
      <div><label class="mb-1 block text-xs font-medium text-slate-500">Phone</label>
        <input class="bq-input" x-model="profile.phone"></div>
      <div><label class="mb-1 block text-xs font-medium text-slate-500">VAT / Tax ID</label>
        <input class="bq-input" x-model="profile.vat_id"></div>
      <div><label class="mb-1 block text-xs font-medium text-slate-500">Default payment terms</label>
        <select class="bq-input" x-model="profile.payment_terms">
          <option>Due on receipt</option><option>Net 7</option><option>Net 14</option><option>Net 30</option>
        </select></div>
      <div><label class="mb-1 block text-xs font-medium text-slate-500">Currency</label>
        <select class="bq-input" x-model="profile.currency">
          <option value="USD">USD — US Dollar</option>
          <option value="AUD">AUD — Australian Dollar</option>
          <option value="GBP">GBP — British Pound</option>
          <option value="EUR">EUR — Euro</option>
        </select></div>
    </div>
    <button class="bq-btn mt-5" @click="save()" x-text="saved ? 'Saved ✓' : 'Save profile'"></button>
  </div>

  <div class="bq-card p-6">
    <h2 class="mb-4 text-sm font-semibold text-slate-900">Logo</h2>
    <div class="flex items-center gap-5">
      <img :src="logoPreview" x-show="logoPreview" x-cloak class="h-20 w-20 rounded-lg border border-slate-200 object-contain bg-white">
      <div>
        <input type="file" accept="image/png,image/jpeg,image/svg+xml" @change="onLogo($event)" class="text-sm">
        <p class="mt-1 text-xs text-slate-400">PNG, JPG or SVG — shown live, stored in this browser for now.</p>
      </div>
    </div>
  </div>

  <p class="text-xs text-slate-400">Profile data is saved in your browser (localStorage) in this version — server-side persistence for the organization is the next step.</p>
</div>

<script>
function settingsPage() {
  return {
    saved: false,
    profile: { name: '', address: '', phone: '', vat_id: '', payment_terms: 'Net 30', currency: 'USD' },
    logoPreview: '',
    init() {
      try {
        const p = JSON.parse(localStorage.getItem('bq_company') || '{}');
        if (p.profile) this.profile = Object.assign(this.profile, p.profile);
        if (p.logo) this.logoPreview = p.logo;
      } catch (e) { /* first visit */ }
    },
    save() {
      localStorage.setItem('bq_company', JSON.stringify({ profile: this.profile, logo: this.logoPreview }));
      this.saved = true;
      setTimeout(() => this.saved = false, 1500);
    },
    onLogo(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { this.logoPreview = reader.result; this.save(); };
      reader.readAsDataURL(file);
    },
  };
}
</script>
{% endblock %}
