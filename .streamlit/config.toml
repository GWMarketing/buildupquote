# Colours for the whole app. Streamlit reads this file automatically when
# you run `streamlit run app.py` from the project folder -- there is
# nothing to install and nothing to import.
#
# Change these five values and the entire app re-colours: buttons, links,
# sliders, checkboxes, tab underlines and focus rings all key off
# primaryColor, and every panel, card and table keys off the two
# background colours. ui.py's CSS is written to use the same palette, so
# the two stay in step.
[theme]
primaryColor = "#0F6CBD"          # the blue on buttons, sliders, active tabs
backgroundColor = "#F5F8FC"       # the page behind everything
secondaryBackgroundColor = "#FFFFFF"  # cards, tables, the sidebar
textColor = "#13212C"
font = "sans serif"

[server]
# A carrier PDF can be large. Streamlit's own default is 200MB; this is
# here so the limit is visible and adjustable rather than a mystery.
maxUploadSize = 300
